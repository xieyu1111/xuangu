name: Refresh dashboard snapshot

on:
  workflow_dispatch:
  schedule:
    # 16:10 Asia/Shanghai every day
    - cron: '10 8 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Generate dashboard JSON
        run: dotnet run --project StockRadar.csproj -c Release -- --snapshot data/dashboard.json

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then
            echo "Dashboard snapshot is unchanged."
            exit 0
          fi
          git commit -m "chore: refresh dashboard snapshot"
          git push
